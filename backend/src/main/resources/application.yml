server:
  port: 8080
  max-http-header-size: 16384

spring:
  application:
    name: url-shortener-api
  datasource:
    # This checks for Render's environment variable first, then falls back to local
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/url_shortener_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      pool-name: ShortenerHikariCP
  jpa:
    hibernate:
      ddl-auto: validate # Automatically creates tables in your empty cloud database
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false # Disabled to prevent conflicts with Hibernate auto-update
  data:
    redis:
      # Automatically reads the direct URL string we set up in the Render environment panel
      url: ${SPRING_REDIS_URL:redis://localhost:6379}
      timeout: 2000ms

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: 86400000

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
