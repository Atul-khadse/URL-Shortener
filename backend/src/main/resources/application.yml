# Deployment Infrastructure Signature: CLOUD_RUN_PROD_FINAL_OK
server:
  port: 8080
  max-http-header-size: 16384

spring:
  application:
    name: url-shortener-api
  datasource:
    # 🌟 FIXED: The broken link is completely gone. This is your real cloud database path:
    url: jdbc:postgresql://://render.com
    username: db_user
    password: WnKf5mzJULP4VyFkGbXz4oJdvcy3z4Eu
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      pool-name: ShortenerHikariCP
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false
  data:
    redis:
      url: ${SPRING_REDIS_URL:redis://localhost:6379}
      timeout: 2000ms

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration-ms: 86400000

app:
  base-url: http://localhost:8080